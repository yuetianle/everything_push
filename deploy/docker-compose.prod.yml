services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fx}
      POSTGRES_DB: fx
    volumes:
      - ../data/pg:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    # 有 CI 镜像（Docker Hub）时优先拉取；DOCKERHUB_USERNAME 留空则走本地 build 并打同名标签
    image: ${DOCKERHUB_USERNAME:-local}/fintrack:backend-${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DATABASE_URL: postgres://fx:${POSTGRES_PASSWORD:-fx}@db:5432/fx
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      SCRAPE_INTERVAL_SECS: ${SCRAPE_INTERVAL_SECS:-180}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/fintrack:frontend-${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fx}
      POSTGRES_DB: fx
      SCHEDULE: "@daily"
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: 30
    volumes:
      - ../data/backups:/backups
    depends_on:
      - db
    restart: unless-stopped
